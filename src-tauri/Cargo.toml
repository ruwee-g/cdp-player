[package]
name = "cdp-player"
version = "0.1.0"
description = "CDP — a minimal retro-styled cross-platform music player"
authors = ["Roman Vovchenko"]
license = "MIT"
repository = "https://github.com/ruwee-g/cdp-player"
edition = "2021"

[lib]
name = "cdp_player_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
lofty = "0.22"
walkdir = "2"
mime_guess = "2"
